<style>
/* Dinkabalen 2026 player portal. */
:root{--navy:#0b1f3a;--navy-2:#16345e;--ink:#101828;--muted:#5d6b7e;--faint:#8a97a8;--line:#e3e8ee;--canvas:#f4f6f8;--white:#fff;--lime:#c8f000;--lime-ink:#2c3600;--live:#d92d20;--amber:#9a5b00;--amber-bg:#fff4e0;--blue:#1d5fb8;--ok:#0f7a3d;--r:14px;--g:clamp(16px,4vw,40px);--sans:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:80px}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;font:16px/1.5 var(--sans);color:var(--ink);background:var(--canvas)}
a{color:var(--blue);text-underline-offset:3px}
a:hover{color:var(--navy)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:4px}
img{display:block;max-width:100%}
h1,h2,h3{margin:0;color:var(--navy);line-height:1.15}
h1{font-size:clamp(1.9rem,5vw,2.6rem);font-weight:800;letter-spacing:-.02em}
h2{font-size:1.3rem;font-weight:700;letter-spacing:-.01em}
h3{font-size:.95rem;font-weight:700}
p{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.ribbon{background:#ffc83d;color:#1a1200;text-align:center;font-size:.8rem;font-weight:700;padding:5px 10px}

/* header and navigation */
.top{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;height:60px;padding:0 var(--g)}
.brand{display:flex;align-items:center;gap:10px;color:var(--navy);text-decoration:none;min-width:0}
.brand:hover{color:var(--navy)}
.brand img{width:36px;height:36px;border-radius:9px}
.brand b{display:block;font-size:1rem;font-weight:800;letter-spacing:-.01em}
.brand small{display:block;font-size:.78rem;color:var(--muted)}
.nav{display:none;gap:4px}
.nav a{padding:8px 12px;border-radius:999px;color:var(--muted);font-size:.92rem;font-weight:600;text-decoration:none}
.nav a:hover{color:var(--navy);background:var(--canvas)}
.nav a[aria-current=page]{color:var(--white);background:var(--navy)}
.tabbar{position:fixed;inset:auto 0 0 0;z-index:40;display:flex;background:var(--white);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar a{flex:1;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--faint);font-size:.7rem;font-weight:600;text-decoration:none}
.tabbar svg{width:22px;height:22px}
.tabbar a[aria-current=page]{color:var(--navy)}
main{flex:1 0 auto;width:100%;margin:0 auto;padding:24px var(--g) 96px}
.foot{background:var(--navy);color:rgba(255,255,255,.75);font-size:.88rem;padding:28px var(--g) 90px}
.foot-in{margin:0 auto;display:flex;flex-wrap:wrap;gap:10px 28px;align-items:center;justify-content:space-between}
.foot b{color:var(--white)}
.foot a{color:var(--lime)}

/* shared building blocks */
.page-h{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:20px}
.page-h p{margin-top:4px}
.eyebrow{font-size:.82rem;font-weight:600;color:var(--muted);margin-bottom:6px}
.sect{margin-top:36px}
.sect-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px;margin-bottom:12px}
.sect-h a{font-size:.9rem;font-weight:600;text-decoration:none}
.note{margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--white);border:1px dashed var(--line);color:var(--muted);font-size:.9rem}
.warn{margin-bottom:18px;padding:12px 14px;border-radius:10px;background:var(--amber-bg);color:var(--amber);font-size:.9rem}
.warn ul{margin-top:6px;padding-left:18px;list-style:disc}
.empty{padding:22px;border-radius:var(--r);background:var(--white);border:1px dashed var(--line);color:var(--muted);text-align:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:12px;border:1px solid var(--line);background:var(--white);color:var(--navy);font:600 .95rem var(--sans);text-decoration:none;cursor:pointer}
.btn:hover{border-color:var(--navy);color:var(--navy)}
.btn-lime{background:var(--lime);border-color:var(--lime);color:var(--lime-ink)}
.btn-lime:hover{background:#d8ff33;border-color:#d8ff33;color:var(--lime-ink)}
.btn-ghost{background:transparent}
.btn-sm{min-height:38px;padding:0 14px;font-size:.88rem}
.btn-danger{color:var(--live)}
.controls{display:grid;gap:12px;margin-bottom:20px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--white);color:var(--muted);font:600 .88rem var(--sans);cursor:pointer}
.seg button:hover{color:var(--navy);border-color:#c5ced9}
.seg button[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:var(--white)}
.filters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.field{display:grid;gap:4px;font-size:.8rem;font-weight:600;color:var(--muted)}
input[type=search],select,input[type=number]{width:100%;min-height:44px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--white);color:var(--ink);font:500 1rem var(--sans)}
input[type=search]:focus-visible,select:focus-visible,input[type=number]:focus-visible{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(29,95,184,.2)}
.count{margin:-6px 0 12px;color:var(--muted);font-size:.9rem}
.filters>*,.brk-grid>*,.brk-cols>*,.tables>*,.two>*,.controls>*{min-width:0}   /* grid items may shrink below their content width */
.seg{min-width:0}
.fx{grid-template-columns:minmax(0,1fr) auto}
.fx-teams,.fx-t{min-width:0}
.court{grid-template-columns:62px minmax(0,1fr)}
@media (min-width:760px){.fx{grid-template-columns:8.5em minmax(0,1fr) auto}.slot .fx{grid-template-columns:5em minmax(0,1fr) auto}
  .brk .fx{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"meta info" "teams teams";padding:12px 14px}
  .brk .fx-meta{flex-direction:row;gap:10px}}
.brk .fx-where{display:none}
@media (min-width:760px){.fx-teams{max-width:460px}}

/* status chips */
.st{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:.75rem;font-weight:700;white-space:nowrap;background:var(--canvas);color:var(--muted)}
.st-live{background:var(--live);color:var(--white)}
.st-live::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--white);animation:pulse 1.4s ease-in-out infinite}
.st-completed{background:#e7edf5;color:var(--navy)}
.st-pending{background:var(--amber-bg);color:var(--amber)}
.st-review{background:#fdecea;color:#b42318}
@keyframes pulse{50%{opacity:.35}}

/* fixture rows: the core component, grouped in lists instead of a wall of cards */
.fx-list{background:var(--white);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.fx{display:grid;grid-template-columns:1fr auto;grid-template-areas:"meta info" "teams teams";gap:8px 12px;padding:12px 14px}
.fx + .fx{border-top:1px solid var(--line)}
.fx-live{box-shadow:inset 3px 0 0 var(--live)}
.fx-meta{grid-area:meta;display:flex;align-items:baseline;gap:10px}
.fx-time{font-size:1rem;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums}
.fx-court{font-size:.88rem;font-weight:600;color:var(--muted)}
.fx-time,.fx-court{white-space:nowrap}
.court .fx-court{display:none}
.fx-info{grid-area:info;display:flex;align-items:center;gap:10px;justify-content:flex-end}
.fx-where{font-size:.8rem;color:var(--faint);white-space:nowrap}
.fx-teams{grid-area:teams;display:grid;gap:4px}
.fx-t{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.fx-n{min-width:0}
.fx-n a{font-weight:700;color:var(--ink);text-decoration:none;font-size:1.02rem;white-space:nowrap}
.fx-n a:hover{color:var(--blue)}
.fx-n small{display:block;color:var(--muted);font-size:.84rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbd{color:var(--faint);font-weight:600}
.fx-s{font-size:1.2rem;font-weight:800;font-variant-numeric:tabular-nums;color:var(--ink)}
.fx-t.lose a,.fx-t.lose .fx-s{color:var(--faint)}
.slot + .slot{margin-top:18px}
.slot-h{display:flex;align-items:baseline;gap:10px;margin-bottom:8px;font-size:1.05rem}
.slot-h small{font-size:.85rem;font-weight:500;color:var(--muted)}
.slot .fx-time{display:none}

/* home */
.hero{position:relative;overflow:hidden;margin:-24px calc(var(--g) * -1) 0;padding:40px var(--g) 36px;background:var(--navy);color:var(--white);display:grid;gap:24px}
.hero::after{content:'';position:absolute;right:-12%;top:-30%;width:70%;height:160%;background:radial-gradient(closest-side,rgba(200,240,0,.16),transparent);pointer-events:none}
.hero-in{position:relative;z-index:1;max-width:620px}
.hero .eyebrow{color:rgba(255,255,255,.7)}
.hero h1{color:var(--white);font-size:clamp(2.4rem,8vw,4.2rem);line-height:1}
.hero-lead{margin:14px 0 22px;font-size:1.08rem;color:rgba(255,255,255,.82)}
.find{position:relative}
.find input{min-height:52px;border:0;font-size:1.02rem;padding:0 16px}
.hits{display:grid;gap:6px;margin-top:8px}
.hit{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;padding:10px 14px;border-radius:10px;background:var(--white);color:var(--ink);text-decoration:none}
.hit b{color:var(--navy)}
.hit span{color:var(--muted);font-size:.9rem}
.hit em{grid-column:1/-1;font-style:normal;font-size:.9rem;color:var(--blue);font-weight:600}
.hits p{color:rgba(255,255,255,.8)}
.hero-cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.hero .btn-ghost{color:var(--white);border-color:rgba(255,255,255,.35)}
.hero .btn-ghost:hover{border-color:var(--white);color:var(--white)}
.hero-logo{position:relative;z-index:1;width:132px;border-radius:24px;box-shadow:0 18px 40px -18px rgba(0,0,0,.7)}
.status{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin:0 calc(var(--g) * -1);padding:12px var(--g);background:var(--white);border-bottom:1px solid var(--line);font-size:.9rem}
.ph{padding:3px 10px;border-radius:999px;font-weight:700;font-size:.8rem;background:var(--canvas);color:var(--navy)}
.ph-rr,.ph-po{background:var(--lime);color:var(--lime-ink)}
.tline{display:grid;gap:0;background:var(--white);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tline li{display:grid;grid-template-columns:6.5em 1fr;gap:2px 14px;padding:14px 16px}
.tline li + li{border-top:1px solid var(--line)}
.tline time{grid-row:span 2;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums}
.tline span{color:var(--muted);font-size:.92rem}
.two{display:grid;gap:36px}
.steps{counter-reset:s;display:grid;gap:14px}
.steps li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:2px 12px}
.steps li::before{content:counter(s);grid-row:span 2;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--navy);color:var(--lime);font-weight:800}
.steps span,.cats span{color:var(--muted);font-size:.93rem}
.cats{display:grid;gap:0;background:var(--white);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.cats li{display:grid;gap:2px;padding:12px 16px}
.cats li + li{border-top:1px solid var(--line)}
.notes{display:grid;gap:8px;color:var(--muted);font-size:.93rem}
.notes li{padding-left:16px;position:relative}
.notes li::before{content:'';position:absolute;left:0;top:.6em;width:6px;height:6px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 2px var(--lime-ink)}

/* live (player) */
.courts{display:grid;gap:10px}
.court{display:grid;grid-template-columns:62px 1fr;background:var(--white);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.court.is-live{border-color:#f1b5b0;box-shadow:0 0 0 1px #f1b5b0}
.court-n{display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--navy);color:var(--white)}
.court-n span{font-size:.65rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.7}
.court-n b{font-size:1.6rem;line-height:1}
.court.is-live .court-n{background:var(--live)}
.court-m .fx{border:0}
.court-free{padding:16px;color:var(--muted)}
.court-next{grid-column:2;padding:0 14px 12px;font-size:.88rem;color:var(--muted)}
.court-next b{color:var(--navy)}

/* standings tables */
.tables{display:grid;gap:14px}
.tbl{background:var(--white);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tbl-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:12px 14px 8px}
.tbl-h b{font-size:1.05rem;color:var(--navy)}
.tbl-h span{font-size:.82rem;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:9px 6px;text-align:center;font-size:.95rem}
th{font-size:.74rem;font-weight:700;color:var(--faint);border-bottom:1px solid var(--line)}
td{border-top:1px solid #eef2f6}
th.tl,td.tl{text-align:left;padding-left:14px}
td.tl a{font-weight:700;color:var(--ink);text-decoration:none}
td.tl a:hover{color:var(--blue)}
td:last-child,th:last-child{padding-right:14px}
tr.cut td{border-top:1px dashed #b8c3cf}
.rk{display:inline-grid;place-items:center;min-width:1.8em;height:1.8em;border-radius:50%;font-weight:800;font-size:.85rem;color:var(--muted)}
tr.in .rk,.rk-in{background:var(--lime);color:var(--lime-ink)}
td.pre{color:var(--faint);font-size:.85rem;text-align:left}
.q{display:block;margin-top:2px;font-size:.75rem;font-weight:600;color:var(--muted)}
.q-q{color:var(--ok)}.q-t{color:var(--amber)}
.prov{margin-bottom:16px;padding:12px 14px;border-radius:10px;background:var(--white);border:1px solid var(--line);color:var(--muted);font-size:.92rem}
.prov b{color:var(--amber)}
.legend{margin-top:14px;color:var(--muted);font-size:.85rem}

/* teams */
.tgroups{display:grid;gap:18px}
.tgroup h3{margin-bottom:8px;color:var(--muted)}
.tlist{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.titem{display:grid;gap:2px;padding:12px 14px;border-radius:12px;background:var(--white);border:1px solid var(--line);color:var(--ink);text-decoration:none}
.titem:hover{border-color:var(--navy);color:var(--ink)}
.titem b{font-size:1.05rem;color:var(--navy)}
.titem-sub{font-size:.86rem;color:var(--muted)}
.titem-next{font-size:.86rem;font-weight:600;color:var(--blue)}
.back{margin-bottom:12px}
.back a{font-weight:600;text-decoration:none}
.team-h{display:grid;gap:16px;margin-bottom:16px}
.team-h h1{font-size:clamp(2.2rem,7vw,3rem)}
.kv{display:flex;gap:10px;margin:0}
.kv div{flex:1;padding:10px 14px;border-radius:12px;background:var(--white);border:1px solid var(--line)}
.kv dt{font-size:.78rem;color:var(--muted)}
.kv dd{margin:0;font-size:1.4rem;font-weight:800;color:var(--navy)}
.kv small{font-size:.8rem;color:var(--muted);font-weight:600}
.qline{display:inline-block;margin-bottom:14px;padding:4px 12px;border-radius:999px;background:var(--white);border:1px solid var(--line);font-size:.88rem;font-weight:600}
.next{padding:18px;border-radius:var(--r);background:var(--navy);color:var(--white)}
.next-l{font-size:.82rem;font-weight:600;color:var(--lime);margin-bottom:8px}
.next-b{display:flex;flex-wrap:wrap;gap:14px 36px}
.next-b div{display:grid}
.next-t,.next-o{font-size:1.9rem;font-weight:800;line-height:1.1}
.next-b span{color:rgba(255,255,255,.75);font-size:.92rem}

/* brackets */
.brk-grid{display:grid;gap:18px}
.brk h3{margin-bottom:8px}
.brk-cols{display:grid;gap:10px}
.brk-l{margin:6px 0 6px;font-size:.8rem;font-weight:700;color:var(--muted)}
.brk .fx-list + .brk-l{margin-top:10px}

/* operator console */
.op-warn{margin-bottom:16px;padding:14px;border-radius:12px;background:var(--amber-bg);color:#6b3f00;font-size:.92rem}
.op-actions{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.op-row{display:grid;grid-template-columns:1fr;gap:8px;padding:12px 14px;border-top:1px solid var(--line);background:var(--white)}
.op-row:first-child{border-top:0}
.op-id{font-weight:700;color:var(--navy)}
.op-id small{display:block;font-weight:500;color:var(--muted)}
.op-f{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.op-f select{width:auto;min-width:130px}
.op-f input[type=number]{width:76px}
.op-list{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.op-ok{margin-bottom:12px;padding:12px 14px;border-radius:10px;background:#e6f6ec;color:#0b5a2c;font-weight:600}
.op-block{margin-bottom:12px;padding:12px 14px;border-radius:10px;background:#fdecea;color:#8a1c12;font-size:.92rem}
.op-block ul{margin-top:6px;padding-left:18px;list-style:disc}
.op-block .btn{margin-left:8px}
.op-stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:0 0 16px}
.op-stat div{padding:10px 14px;border-radius:12px;background:var(--white);border:1px solid var(--line)}
.op-stat dt{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.op-stat dd{margin:0;font-size:1.5rem;font-weight:800;color:var(--navy)}
.op-stat small{color:var(--muted);font-size:.8rem}
.op-lbl{display:grid;gap:2px;font-size:.72rem;font-weight:700;color:var(--muted);max-width:220px}
.op-lbl input{width:84px;min-height:44px;padding:0 10px;border-radius:10px;border:1px solid var(--line);font:700 1.2rem var(--sans);text-align:center;color:var(--ink)}
.op-dec{max-width:none}
.op-f .btn{min-height:44px;align-self:end}
.op-dec input{width:min(320px,70vw);text-align:left;font:500 .95rem var(--sans)}
.op-conf{display:block;margin-top:4px;font-style:normal;font-weight:700;color:#b42318;font-size:.85rem}
.op-bad{box-shadow:inset 4px 0 0 #d92d20}
.op-review{margin-bottom:16px;padding:16px;border-radius:14px;background:var(--white);border:2px solid var(--navy)}
.op-review .tw{max-height:280px;overflow:auto;margin:10px 0;border:1px solid var(--line);border-radius:10px}
.op-review td,.op-review th,.op-hist td,.op-hist th{text-align:left;padding:6px 10px;font-size:.85rem}
.op-rbox{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-top:10px}
.op-rbox input{min-height:40px;padding:0 10px;border:1px solid var(--line);border-radius:8px}
.op-hist{max-height:420px;overflow:auto;background:var(--white);border:1px solid var(--line);border-radius:var(--r)}

@media (min-width:760px){
  .nav{display:flex}
  .tabbar{display:none}
  main{padding-bottom:56px}
  .foot{padding-bottom:28px}
  .fx{grid-template-columns:8.5em minmax(0,1fr) auto;grid-template-areas:"meta teams info";align-items:center;padding:12px 18px}
  .fx-meta{flex-direction:column;gap:0}
  .slot .fx{grid-template-columns:5em minmax(0,1fr) auto}
  .hero{grid-template-columns:1fr auto;align-items:center;padding:56px var(--g) 52px;border-radius:0 0 28px 28px}
  .hero-logo{width:220px}
  .two{grid-template-columns:1fr 1fr}
  .tline{grid-template-columns:repeat(4,1fr)}
  .tline li{grid-template-columns:1fr;border-top:0!important}
  .tline li + li{border-left:1px solid var(--line)}
  .tline time{grid-row:auto;font-size:1.25rem}
  .filters{grid-template-columns:repeat(5,minmax(0,1fr))}
  .team-h{grid-template-columns:1fr auto;align-items:end}
  .kv div{min-width:110px}
  .tables-2{grid-template-columns:1fr 1fr}
  .brk-cols{grid-template-columns:1fr 1fr}
  .op-row{grid-template-columns:minmax(200px,1.2fr) 2fr}
}
@media (min-width:1100px){
  .tables-3{grid-template-columns:repeat(3,1fr)}
  .brk-grid{grid-template-columns:1fr 1fr}
}

:root{--ui:"Oswald",var(--sans);--disp:"Barlow Condensed","Arial Narrow",var(--sans);--lime-dk:#557a00;--lift:0 14px 34px -22px rgba(11,31,58,.35)}
body{background:radial-gradient(1100px 480px at 88% 0,rgba(200,240,0,.09),transparent 62%),linear-gradient(180deg,#f8fafc,#eef2f6 70%)}
html{scroll-padding-top:130px}
.top{background:rgba(255,255,255,.97)}
.bar{height:66px}
.brand b{font-size:1.02rem}
.brand small{font-size:.64rem;font-weight:800;letter-spacing:.13em;text-transform:uppercase}
.brand img{box-shadow:0 4px 10px -4px rgba(11,31,58,.5)}
.top-c{display:none;text-align:center;min-width:0}
.top-c b{display:block;font-size:1.12rem;font-weight:900;letter-spacing:.13em;text-transform:uppercase;color:var(--navy)}
.top-c small{display:block;font-size:.64rem;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.top-r{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--white);color:var(--navy);font-size:1.15rem;line-height:1;cursor:pointer;box-shadow:0 3px 8px -4px rgba(11,31,58,.35)}
.top-r:hover{border-color:var(--navy)}
@media (min-width:980px){.bar{display:grid;grid-template-columns:1fr auto 1fr}.top-c{display:block}.top-r{justify-self:end}}
.nav{justify-content:center;gap:6px;padding:8px var(--g);border-top:1px solid var(--line)}
.nav a{position:relative;padding:9px 16px;border-radius:10px;color:var(--navy-2);font-size:.8rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase}
.nav a:hover{background:#eef2f6;color:var(--navy)}
.nav a[aria-current=page]{background:#e8eef6;color:var(--navy)}
.nav a[aria-current=page]::after{content:'';position:absolute;left:16px;right:16px;bottom:-9px;height:3px;border-radius:2px;background:linear-gradient(90deg,var(--navy),var(--lime))}
.band{position:relative;overflow:hidden;background:linear-gradient(100deg,var(--navy) 0%,var(--navy-2) 62%,#1f4c84 100%);color:var(--white)}
.band[hidden]{display:none}
.band::after,.court-n::after,main .tbl-h::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 62%,rgba(255,255,255,.07) 62%,rgba(255,255,255,.07) 74%,transparent 74%);pointer-events:none}
.band-in{padding:0 var(--g)}
.band-box{position:relative;z-index:1;display:inline-grid;gap:2px;max-width:100%;padding:18px 34px 18px 18px;border-inline:1px solid rgba(255,255,255,.12);background:linear-gradient(115deg,rgba(255,255,255,.07),transparent)}
.band-box b{font-size:.66rem;font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:var(--lime)}
.band-box span{font-size:.88rem;font-weight:700}
.band-box small{font-size:.78rem;color:rgba(255,255,255,.72)}
main{padding-top:36px}
.hero{margin-top:-36px}
.eyebrow{font-size:.68rem;font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:var(--lime-dk)}
.hero .eyebrow{color:var(--lime);letter-spacing:.1em}
.hero h1,.page-h h1,.team-h h1{font-weight:900;letter-spacing:-.035em;line-height:.95;text-transform:uppercase}
.page-h{margin-bottom:28px}
.page-h h1,.team-h h1{font-size:clamp(2.5rem,7vw,4.6rem)}
.page-h>div::after,.team-h>div:first-child::after{content:'';display:block;width:64px;height:4px;margin-top:14px;border-radius:2px;background:linear-gradient(90deg,var(--navy),var(--lime))}

  body[data-tab=live] .lv-up .slot + .slot{margin-top:1.4vh}
  body[data-tab=live] .lv-up .fx{padding:.8vh 16px}
  body[data-tab=live] .lv-up .fx-n{display:flex;align-items:baseline;gap:.45em;min-width:0}
  body[data-tab=live] .lv-up .fx-n a{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* scoreboard alignment: left team ends at a fixed centre "v", right team starts after it; codes on the outer edges */
  body[data-tab=live] .lv-up .fx-teams{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:2.6em;align-items:baseline}
  body[data-tab=live] .lv-up .fx-t{position:relative;min-width:0}
  body[data-tab=live] .lv-up .fx-t:first-child{justify-content:flex-end}
  body[data-tab=live] .lv-up .fx-t:first-child .fx-n{flex-direction:row-reverse}
  body[data-tab=live] .lv-up .fx-t + .fx-t::before{position:absolute;left:-1.65em;width:.7em;margin:0;text-align:center}
  body[data-tab=live] .lv-up .fx-s:empty,body[data-tab=live] .lv-up .fx-where,body[data-tab=live] .lv-up .st-scheduled{display:none}
  body[data-tab=live] .lv-up .fx-n small{font-size:clamp(.7rem,1.3vh,.88rem)}
  body[data-tab=live] .lv-up .slot-h{font-size:clamp(1.4rem,3.3vh,2.1rem)}
  body[data-tab=live] .lv-st .tables{margin-top:1vh!important}
  body[data-tab=live] .lv-st td{padding-top:.5vh;padding-bottom:.5vh}
  body[data-tab=live] .lv-st .tbl-h{padding:1.1vh 16px}
  body[data-tab=live] .lv-st .sect-h{flex-wrap:nowrap;align-items:center}
  body[data-tab=live] .lv-st .tn{display:inline;margin-left:.45em}
  /* court cards carry their own queue; Coming up list and the old next line are not needed on the TV */
  body[data-tab=live] .lv-up{display:none}
  body[data-tab=live] .lv-bottom{grid-template-columns:minmax(0,1fr)}
  body[data-tab=live] .court{display:flex;flex-direction:column}
  body[data-tab=live] .court-q{display:grid;gap:.5vh;margin-top:auto;padding:1vh 14px 1.3vh;border-top:1px solid var(--line);background:#f7f9fb}
  body[data-tab=live] .court-q li{display:grid;grid-template-columns:4.4em minmax(0,1fr);align-items:baseline;gap:0 .5em;padding:.45vh .6em;border-radius:8px;font-family:var(--ui);font-weight:500;letter-spacing:-.01em;font-size:clamp(.84rem,1.6vh,1.06rem);color:var(--navy)}
  body[data-tab=live] .court-q li[hidden]{display:none}
  /* queued match tinted by category, as on the organizers' sheet; HI is neon green */
  body[data-tab=live] .court-q li{box-shadow:inset 4px 0 0 var(--cq);background:var(--cqb)}
  body[data-tab=live] .court-q .cq-LA{--cq:#2b6fd0;--cqb:#e7effb}
  body[data-tab=live] .court-q .cq-LB{--cq:#1f9a4c;--cqb:#e3f4e9}
  body[data-tab=live] .court-q .cq-NA{--cq:#f0b400;--cqb:#fff5d1}
  body[data-tab=live] .court-q .cq-HI{--cq:#b8e600;--cqb:#f1fbc8}
  body[data-tab=live] .court-q time b{display:block;width:max-content;margin-top:3px;padding:1px 6px;border-radius:3px;background:var(--navy);color:var(--white);font-size:.68em;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
  body[data-tab=live] .court-q time{grid-row:span 2;font-weight:600;font-variant-numeric:tabular-nums;font-size:.88em;color:var(--muted);font-variant-numeric:tabular-nums}
  body[data-tab=live] .court-q li.cq-deck time{color:var(--navy)}
  body[data-tab=live] .court-q span{grid-column:2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
  body[data-tab=live] .court-q-end{display:block;font-size:.85rem;color:var(--muted)}
  body[data-tab=live] .lv-pair{grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:2vw;align-items:start}
  body[data-tab=live] .lv-div{gap:1.4vw}
  body[data-tab=live] .lv-st .q{display:none}
  /* shared TV screen: never personalize */
  body[data-tab=live] .fx-mine,body[data-tab=live] tr.mine td{background:none}
  body[data-tab=live] .me::before,body[data-tab=live] tr.mine td.tl a::before{content:none}
  body[data-tab=live] .lres li.mine{box-shadow:var(--lift)}
  /* one slim header row: brand, tabs, reload */
  body[data-tab=live] .top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;column-gap:16px;height:60px;padding:0 var(--g)}
  body[data-tab=live] .bar{display:contents}
  body[data-tab=live] .top-c{display:none}
  body[data-tab=live] .brand{order:1}
  body[data-tab=live] .nav{order:2;border-top:0;padding:0}
  body[data-tab=live] .top-r{order:3;justify-self:end}
  body[data-tab=live] .page-h{flex-wrap:nowrap;align-items:center}
  body[data-tab=live] .lv-clock{display:block;font-size:clamp(2.2rem,6.4vh,4.4rem);font-weight:900;letter-spacing:-.02em;line-height:1;color:var(--navy);font-variant-numeric:tabular-nums}
  /* court cards readable from across the hall */
  body[data-tab=live] .court .fx-time{font-size:clamp(1rem,2.2vh,1.45rem)}
  body[data-tab=live] .court .fx-n a{font-size:clamp(1.05rem,2.45vh,1.7rem);line-height:1.2}
  body[data-tab=live] .court .fx-n a{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
  body[data-tab=live] .court .fx-s{font-size:clamp(1.6rem,4.6vh,3.1rem)}
  body[data-tab=live] .court .fx-teams{gap:.4vh}
  /* courts heading is implied by the court bands; latest results label sits left of its row */
  body[data-tab=live] .lv-courts>.sect-h{display:none}
  body[data-tab=live] .lv-res{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;column-gap:20px}
  body[data-tab=live] .lv-res>.sect-h{margin:0}
  body[data-tab=live] .lv-res>.sect-h a{display:none}
  body[data-tab=live] .lv-res h2{line-height:.95;max-width:5.2em}
  /* latest results: one row */
  body[data-tab=live] .lres{grid-template-columns:repeat(5,minmax(0,1fr))}
  body[data-tab=live] .lres li{padding:.9vh 14px}
  body[data-tab=live] .lres .lr-t{font-size:clamp(.9rem,1.8vh,1.15rem)}
  /* coming up: one line per match */
  body[data-tab=live] .lv-up .fx-t + .fx-t::before{content:'v';color:var(--faint);font-weight:600}
  body[data-tab=live] .lv-up .fx-n a{font-size:clamp(1.1rem,2.3vh,1.5rem)}
  body[data-tab=live] .lv-up .slot .fx-court{display:flex;align-items:baseline;gap:6px;font-size:clamp(1.3rem,2.9vh,1.8rem)}
  body[data-tab=live] .lv-up .slot .fx-court small{margin:0}
  body[data-tab=live] .lv-st .fx-n small{display:none}
  body[data-tab=live] .lv-st .brk{padding:1.4vh 16px}
  body[data-tab=live] .lv-st .brk h3{font-size:1.05rem;margin-bottom:.6vh}
  body[data-tab=live] .lv-st .brk .fx{padding:.7vh 12px}
  body[data-tab=live] .lv-st .brk .fx-teams{gap:0}
  body[data-tab=live] .lv-st .brk-l{margin:.5vh 0}
  body[data-tab=live] .lv-st .st-scheduled{display:none}
  /* TV layout leaves out player names and the next-match line (Coming up lists it) so codes and scores stay big */
  body[data-tab=live] .court-next{display:none}
  body[data-tab=live] .court .fx-n small{font-size:clamp(.72rem,1.4vh,.95rem)}
}
@media (min-width:1100px) and (min-height:600px) and (max-height:960px) and (orientation:landscape){
  body[data-tab=live] .lv-st .brk h3{display:none}
  body[data-tab=live] .lres li{gap:2px 6px;padding:.8vh 10px}
  body[data-tab=live] .lres .lr-t{font-size:.86rem}
  body[data-tab=live] .lres .lr-s{padding:1px 6px;font-size:.95rem}
  body[data-tab=live] .lv-st td{padding-top:.4vh;padding-bottom:.4vh;font-size:.9rem}
  body[data-tab=live] .lv-st th{padding-top:.4vh;padding-bottom:.4vh}
  body[data-tab=live] .lv-st .tbl-h{padding:.6vh 14px}
  body[data-tab=live] .lv-st .rk{min-width:1.5em;height:1.5em}
  body[data-tab=live] .lv-st .tn{display:none}
  body[data-tab=live] .lres .lr-m{display:none}
}
/* standings: each group is a card with a navy header band */

main .tbl-h b{position:relative;z-index:1;color:var(--white);font-size:1.1rem;font-weight:900;letter-spacing:.02em}
main .tbl-h span{position:relative;z-index:1;color:rgba(255,255,255,.75);font-size:.66rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
main .rk{background:#eef2f6;color:var(--navy)}
main tr.in .rk,main .rk-in{background:var(--lime);color:var(--lime-ink)}
/* playoffs and team page */
.brk{padding:18px;background:var(--white);border:1px solid var(--line)}
.brk h3{font-size:1.2rem;font-weight:900;color:var(--navy)}
.brk .fx-list{box-shadow:none}
.brk-l{font-size:.64rem;font-weight:800;letter-spacing:.13em;text-transform:uppercase}
.kv{gap:0;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--white);box-shadow:var(--lift)}
.kv div{border:0;border-radius:0}
.kv div + div{border-left:1px solid var(--line)}
.kv dt{font-size:.62rem;font-weight:800;letter-spacing:.13em;text-transform:uppercase}
.kv dd{font-weight:900}
.next{position:relative;overflow:hidden;background:linear-gradient(100deg,var(--navy),var(--navy-2) 70%,#1f4c84);box-shadow:var(--lift)}
.next-l{font-size:.66rem;font-weight:800;letter-spacing:.15em;text-transform:uppercase}
.titem{box-shadow:0 8px 20px -16px rgba(11,31,58,.4)}

const clubId = code => { const m = /^(D\d)-[A-Z]+-(\d+)$/.exec(code); return m ? `${m[1]}-T${m[2]}` : code; };
const CLUBS = (() => { const map = {}; TEAMS.forEach(t => { const id = clubId(t.code); (map[id] = map[id] || { id, codes: [] }).codes.push(t.code); }); return map; })();
const clubName = id => { const m = /^D(\d)-T(\d+)$/.exec(id); return m ? `Division ${m[1]} · Team ${m[2]}` : `${id} · ${CAT[TEAM[id].cat].name}`; };
let MY = (() => { try { const v = localStorage.getItem(MY_KEY); return CLUBS[v] ? v : TEAM[v] ? clubId(v) : null; } catch { return null; } })();

function setMy(id) {
  try { if (id) localStorage.setItem(MY_KEY, id); else localStorage.removeItem(MY_KEY); }

/* ---------- components ---------- */
const chip = m => `<span class="st st-${statusOf(m)}">${STATUS_LABEL[statusOf(m)]}</span>`;
function fixture(m) {
  const done = m.status === 'completed';
  const side = i => {
    const c = i ? m.b : m.a, p = i ? m.sb : m.sa, o = i ? m.sa : m.sb;
    const cls = done ? (p > o ? ' win' : ' lose') : '';

    const sub = c && rosterText(c) ? `<small>${esc(c)}</small>` : '';
    return `<div class="fx-t${cls}"><span class="fx-n">${name}${sub}</span><span class="fx-s">${p ?? ''}</span></div>`;
  };
  return `<article class="fx fx-${statusOf(m)}${isMine(m.a) || isMine(m.b) ? ' fx-mine' : ''}"><div class="fx-meta"><b class="fx-time">${esc(fmtTime(m.start))}</b><span class="fx-court"><small>Court</small> ${m.court}</span></div>` +
    `<div class="fx-teams">${side(0)}${side(1)}</div><div class="fx-info"><span class="fx-where">${esc(where(m))}</span>${chip(m)}</div></article>`;

const fixtureRows = list => (list.length ? `<div class="fx-list">${list.map(fixture).join('')}</div>` : '');
function fixturesBySlot(list, firstTag = '') {
  const slots = [...new Set(list.map(m => m.slot))];
  return slots.map((s, i) => {
    const ms = list.filter(m => m.slot === s), tag = i === 0 && firstTag;
    return `<section class="slot${tag ? ' slot-deck' : ''}"><h3 class="slot-h">${esc(SLOT_TIMES[s])}<small>${ms.length} ${ms.length === 1 ? 'match' : 'matches'}</small>${tag ? `<em class="deck">${esc(firstTag)}</em>` : ''}</h3>${fixtureRows(ms)}</section>`;
  }).join('');
}
function bracket(c) { const g = r => MATCH[`${c.id}-${r}`]; return `<div class="brk"><h3>${esc(c.name)}</h3><div class="brk-cols"><div><p class="brk-l">Semifinals</p>${fixtureRows([g('SF1'), g('SF2')])}</div><div><p class="brk-l">Championship</p>${fixtureRows([g('CHAMPIONSHIP')])}<p class="brk-l">Bronze</p>${fixtureRows([g('BRONZE')])}</div></div></div>`; }
function standingsTable(g, compact = false, focus = null) {
  const s = STAND[g.id];
  const head = compact ? '<th>W–L</th><th>PD</th>' : '<th>W</th><th>L</th><th>PE</th><th>PC</th><th>PQ</th>';
  const pq = r => (r.pf + r.pa ? (r.pf / (r.pf + r.pa)).toFixed(3) : '–'); // Point Quotient = PE / (PE + PC); shown only, not a ranking rule
  const rows = s.rows.map((r, i) => {
    const q = qualStatus(r.code), cls = [i === s.k ? 'cut' : '', s.anyPlayed && r.rank <= s.k ? 'in' : '', isMine(r.code) ? 'mine' : '', r.code === focus ? 'focus' : ''].join(' ').trim();

    return `<tr${cls ? ` class="${cls}"` : ''}><td><span class="rk">${s.anyPlayed ? r.rank : '–'}</span></td><td class="tl"><a href="#/team/${esc(r.code)}">${esc(label(r.code))}</a>${rosterText(r.code) ? `<small class="tn">${esc(r.code)}</small>` : ''}${!compact && q ? `<span class="q q-${q[0]}">${esc(q[1])}</span>` : ''}</td>${nums}</tr>`;
  }).join('');

}
const seg = (key, opts, label) => `<div class="seg" role="group" aria-label="${label}">${opts.map(([v, t]) => `<button type="button" data-k="${key}" data-v="${esc(v)}" aria-pressed="${String(state[key]) === String(v)}">${esc(t)}</button>`).join('')}</div>`;
const select = (key, label, opts) => `<label class="field">${label}<select data-k="${key}">${opts.map(([v, t]) => `<option value="${esc(v)}"${String(state[key]) === String(v) ? ' selected' : ''}>${esc(t)}</option>`).join('')}</select></label>`;

  const groupsDone = pg.id === 'PO';

// One pair's live/next/last match lines, shared by the Home card and the My team page.
function pairNow(c) {
  const ms = teamMatches(c), live = ms.find(m => m.status === 'live'), nx = ms.find(m => m.status === 'scheduled'), last = ms.filter(m => m.status === 'completed').pop();
  const opp = m => (m.a === c ? sideName(m, 1) : sideName(m, 0)), mine = m => (m.a === c ? [m.sa, m.sb] : [m.sb, m.sa]);

    : nx ? `<em>Next ${esc(fmtTime(nx.start))} · Court ${nx.court} · v ${esc(opp(nx))}</em>` : '<em>No more scheduled matches</em>';
  const prev = last ? (() => { const [a, b] = mine(last); return `<small>Last: ${a > b ? 'won' : 'lost'} ${a}–${b} v ${esc(opp(last))}</small>`; })() : '';

function teamView(code) {
  const t = TEAM[code];
  if (!t) return `<p class="back"><a href="#/teams">← All teams</a></p>${none('Team not found.')}`;
  const s = STAND[t.group], me = s.rows.find(x => x.code === code), ms = teamMatches(code), q = qualStatus(code), club = clubId(code);
  const pq = me.pf + me.pa ? (me.pf / (me.pf + me.pa)).toFixed(3) : '–';
  const card = m => {
    const i = m.a === code ? 0 : 1, oc = i ? m.a : m.b, st = statusOf(m), mine = i ? m.sb : m.sa, theirs = i ? m.sa : m.sb;
    const won = m.status === 'completed' && mine > theirs, po = m.stage !== 'preliminary';
    const score = m.status === 'scheduled' ? chip(m) : `<b>${mine ?? 0}–${theirs ?? 0}</b>${m.status === 'completed' ? `<i class="${won ? 'w' : 'l'}">${won ? 'Won' : 'Lost'}</i>` : chip(m)}`;
    const opp = oc ? `<a href="#/team/${esc(oc)}">VS ${esc(label(oc))}</a>${rosterText(oc) ? `<span>${esc(oc)}</span>` : ''}` : `<b class="tbd">VS ${esc(placeholder(m, i ? 0 : 1))}</b>`;
    return `<article class="pm${po ? ' pm-po' : ''}${st === 'live' ? ' pm-live' : ''}"><div class="pm-when"><b>${esc(fmtTime(m.start))}</b><span>Court ${m.court}</span></div>
      <div class="pm-vs"><small>Opponent</small>${opp}<em>${po ? esc(ROUNDS[m.round]) : `Group match · ${esc(m.group)}`} · ${STATUS_LABEL[st]}</em></div>
      <div class="pm-score">${score}</div></article>`;
  };
  const up = ms.filter(m => m.status !== 'completed'), done = ms.filter(m => m.status === 'completed');
  const kv = [['Rank', s.anyPlayed ? `${me.rank}<small>/${s.rows.length}</small>` : '–'], ['W', me.w], ['L', me.l], ['PE', me.pf], ['PC', me.pa], ['PQ', pq]];
  return `<p class="back"><a href="#/teams">← All teams</a></p>
  <section class="pv"><div><p class="pv-l">Player view</p><h1>${esc(label(code))}</h1><p class="pv-sub">${esc(code)} · ${esc(CAT[t.cat].name)}${CLUBS[club].codes.length > 1 ? ' · ' + esc(clubName(club)) : ''}</p></div>
    <dl class="pv-kv">${kv.map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>
    ${myBar(club)}${q ? `<p class="qline q-${q[0]}">${esc(q[1])}</p>` : ''}</section>
  <section class="sect"><div class="sect-h"><h2>Your group</h2><span class="muted">${esc(CAT[t.cat].name)} · ${esc(t.group)}</span></div>${standingsTable(groupById(t.group), false, code)}${standNote()}</section>
  <section class="sect"><div class="sect-h"><h2>Upcoming matches</h2><span class="muted">${up.length} upcoming</span></div>${up.length ? `<div class="pms">${up.map(card).join('')}</div>` : none('No more scheduled matches for this pair.')}</section>
  <section class="sect"><div class="sect-h"><h2>Completed matches</h2><span class="muted">${done.length} completed</span></div>${done.length ? `<div class="pms">${done.map(card).join('')}</div>` : none('No completed matches yet.')}</section>
  <p class="note">Playoff matches appear here once this pair is confirmed as a qualifier.</p>`;
}

const STAGE_OK = { all: () => true, rr: m => m.stage === 'preliminary', sf: m => m.stage === 'semifinal', medal: m => m.stage === 'bronze' || m.stage === 'championship' };
function matchesList() {
  const q = norm(state.q.trim());
  const list = MATCHES.filter(m => (!q || norm(m.id).includes(q) || [m.a, m.b].some(c => c && teamText(c).includes(q))) && STAGE_OK[state.stage](m) &&
    (state.cat === 'all' || m.cat === state.cat) && (state.group === 'all' || m.group === state.group) && (state.court === 'all' || m.court === +state.court) &&
    (state.slot === 'all' || m.slot === +state.slot) && (state.status === 'all' || statusOf(m) === state.status)).sort(byTime);
  const showBrackets = state.stage !== 'rr' && !q && state.group === 'all';
  const cats = CATEGORIES.filter(c => state.cat === 'all' || c.id === state.cat);
  return `<p class="count">${list.length} of ${MATCHES.length} matches</p>${fixturesBySlot(list) || none('No match fits these filters.')}
  ${showBrackets ? `<section class="sect"><div class="sect-h"><h2>Playoff brackets</h2><span class="muted">Participants show as TBD until qualifiers are confirmed</span></div><div class="brk-grid">${cats.map(bracket).join('')}</div></section>` : ''}`;
}
function matchesView() {
  const groups = GROUPS.filter(g => state.cat === 'all' || g.cat === state.cat);
  return `<div class="page-h"><div><p class="eyebrow">Official schedule</p><h1>Matches</h1><p class="muted">${esc(freshness())}</p></div></div>
  <div class="controls">${seg('stage', [['all', 'All stages'], ['rr', 'Round robin'], ['sf', 'Semifinals'], ['medal', 'Medal matches']], 'Stage')}${seg('cat', CAT_OPTS, 'Category')}
    <div class="filters">
      <label class="field">Team or player<input type="search" id="q" placeholder="e.g. HI-1" autocomplete="off" value="${esc(state.q)}"></label>
      ${select('group', 'Group', [['all', 'All groups'], ...groups.map(g => [g.id, g.id])])}
      ${select('court', 'Court', [['all', 'All courts'], ...Array.from({ length: TOURNAMENT.courts }, (_, i) => [i + 1, 'Court ' + (i + 1)])])}
      ${select('slot', 'Time', [['all', 'All times'], ...SLOT_TIMES.map((t, i) => [i, t])])}
      ${select('status', 'Status', [['all', 'Any status'], ['scheduled', 'Scheduled'], ['live', 'Live'], ['pending', 'Result pending'], ['completed', 'Final']])}
    </div></div><div id="list">${matchesList()}</div>`;
}

function standingsView() {
  const order = g => (g.id.startsWith('D1-') ? 0 : g.id.startsWith('D2-') ? 1 : 2);
  const gs = GROUPS.filter(g => state.cat === 'all' || g.cat === state.cat).sort((a, b) => order(a) - order(b) || GROUPS.indexOf(a) - GROUPS.indexOf(b));
  return `<div class="page-h"><div><p class="eyebrow">Semifinal qualification</p><h1>Standings</h1><p class="muted">${esc(freshness())}</p></div></div>
  <div class="controls">${seg('cat', CAT_OPTS, 'Category')}</div>
  <p class="prov">${RANKING_APPROVED ? `Ranked by ${esc(rankingText())}.` : `<b>Provisional.</b> Ranked by ${esc(rankingText())} until the committee approves the final tiebreaking rules. Qualification is confirmed only when a group is complete with no unresolved tie.`}</p>
  <div class="tables ${gs.length > 2 ? 'tables-3' : 'tables-2'}">${gs.map(g => standingsTable(g)).join('')}</div>
  <p class="legend">W won · L lost · PE points earned · PC points conceded · PQ point quotient = PE ÷ (PE + PC), shown for information · <span class="rk rk-in">1</span> qualifying place</p>`;
}

/* Administrative console, backup, storage, and publication functions removed from public release. */

/* ---------- shell ---------- */
const svg = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const ICON = {
  home: svg('<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>'),
  live: svg('<circle cx="12" cy="12" r="2"/><path d="M16.2 7.8a6 6 0 0 1 0 8.4M7.8 16.2a6 6 0 0 1 0-8.4M19.1 4.9a10 10 0 0 1 0 14.2M4.9 19.1a10 10 0 0 1 0-14.2"/>'),
  teams: svg('<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.5a5 5 0 0 1 6 5.5"/>'),
  matches: svg('<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>'),
  standings: svg('<path d="M5 21V11M12 21V4M19 21v-6"/>'),
  my: svg('<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>')
};
// Live on a wide landscape screen fits one viewport (same query as the CSS block "Live on a laptop or TV").
const FIT = matchMedia('(min-width:1100px) and (min-height:600px) and (orientation:landscape)');
const ROTATE_MS = 15000;
let liveTimer = null, clockTimer = null, fitTimer = null;
function fitLive() {
  const box = $('.lv-up-list'), more = $('#upmore');
  if (!box || !FIT.matches) return;
  const slots = [...box.querySelectorAll('.slot')];
  slots.forEach(sl => { sl.hidden = false; });
  let cut = 0; // drop whole time slots from the end, so no court is missing from a slot
  for (let i = slots.length - 1; i > 0 && box.scrollHeight > box.clientHeight + 1; i--) { slots[i].hidden = true; cut += slots[i].querySelectorAll('.fx').length; }
  if (more) { const n = +more.dataset.n + cut; more.textContent = `${n} more in the schedule →`; more.hidden = n === 0; }
  const fitStand = () => { // standings/bracket: shrink to the space left, never below 55%
    const stBox = $('.lv-st-body'), stFit = $('.lv-fit'); if (!stBox || !stFit) return 1;
    stFit.style.zoom = ''; let z = 1;
    for (let n = 0; n < 4 && z > 0.55; n++) { // vh-based spacing does not scale linearly, so re-measure
      const r = stFit.getBoundingClientRect(), room = stBox.getBoundingClientRect().bottom - r.top;
      if (r.height <= room) break;
      z = Math.max(0.55, z * (room - 4) / r.height); stFit.style.zoom = z.toFixed(3);
    }
    return z;
  };
  document.querySelectorAll('.court-q li').forEach(li => { li.hidden = false; });
  const res = $('.lv-res'); if (res) res.hidden = false;
  if (fitStand() < 0.8) { document.querySelectorAll('.court-q li:nth-child(2)').forEach(li => { li.hidden = true; }); fitStand(); }
  const st = $('.lv-st'), last = st && [...st.querySelectorAll('tr, .fx')].pop();
  if (res && last && last.getBoundingClientRect().bottom > st.getBoundingClientRect().bottom + 0.5) { res.hidden = true; fitStand(); } // small screens: drop Latest results last
  const over = () => { const l = st && [...st.querySelectorAll('tr, .fx')].pop(); return l && l.getBoundingClientRect().bottom > st.getBoundingClientRect().bottom + 0.5; };
  if (over()) { document.querySelectorAll('.court-q li').forEach(li => { li.hidden = true; }); fitStand(); } // very short screens, 6-row HI table only
}
function nextLiveCat() { const pages = livePages(), i = Math.max(0, pages.findIndex(x => x.id === state.lcat)); state.lcat = pages[(i + 1) % pages.length].id; render(true); }
FIT.addEventListener('change', () => { if (document.body.dataset.tab === 'live') render(true); });
if (document.fonts) document.fonts.ready.then(() => fitLive()); // re-fit once the embedded display font has loaded
addEventListener('resize', () => { clearTimeout(fitTimer); fitTimer = setTimeout(fitLive, 120); });
const TABS = [['home', 'Home'], ['live', 'Live'], ['teams', 'Teams'], ['matches', 'Matches'], ['standings', 'Standings']];
const VIEWS = { home: homeView, my: myView, live: liveView, teams: teamsView, matches: matchesView, standings: standingsView };
const LISTS = { teams: clubList, my: clubList, matches: matchesList };

function render(keepScroll) {
  const [id, arg] = location.hash.replace(/^#\/?/, '').split('/');
  const tab = id === 'team' ? (isMine(decodeURIComponent(arg || '')) ? 'my' : 'teams') : VIEWS[id] ? id : 'home';
  document.body.dataset.tab = tab;
  const navTab = tab === 'my' ? 'teams' : tab; // My team lives under the Teams tab
  const links = icons => TABS.map(([k, v]) => `<a href="#/${k}"${k === navTab ? ' aria-current="page"' : ''}>${icons ? ICON[k] : ''}<span>${v}</span></a>`).join('');
  $('#nav').innerHTML = links(false); $('#tabbar').innerHTML = links(true);
  const ph = phase(), band = $('#band');
  band.hidden = tab === 'home'; // home has its own hero and status row
  band.innerHTML = `<div class="band-in"><div class="band-box"><b>Tournament</b><span>${esc(ph.label)} · ${esc(ph.sub)}</span><small>${esc(freshness())}</small></div></div>`;
  const app = $('#app');
  app.innerHTML = notices() + (id === 'team' ? teamView(decodeURIComponent(arg || '')) : VIEWS[tab]());
  app.querySelectorAll('button[data-k]').forEach(b => b.addEventListener('click', () => { state[b.dataset.k] = b.dataset.v; if (b.dataset.k === 'cat') state.group = 'all'; render(true); }));
  app.querySelectorAll('select[data-k]').forEach(s => s.addEventListener('change', () => { state[s.dataset.k] = s.value; render(true); }));
  const q = $('#q');
  if (q && LISTS[tab]) q.addEventListener('input', () => { state.q = q.value; $('#list').innerHTML = LISTS[tab](); });
  const follow = $('#follow');
  if (follow) follow.addEventListener('change', () => { if (follow.value) location.hash = '#/team/' + follow.value; });
  const hq = $('#hq');
  if (hq) hq.addEventListener('input', () => {
    const v = norm(hq.value.trim()), found = v ? TEAMS.filter(t => teamText(t.code).includes(v)).slice(0, 5) : [];
    $('#hits').innerHTML = !v ? '' : found.length ? found.map(t => { const nx = teamMatches(t.code).find(m => m.status !== 'completed'); return `<a class="hit" href="#/team/${esc(t.code)}"><b>${esc(t.code)}</b><span>${esc(rosterText(t.code) || CAT[t.cat].name)}</span>${nx ? `<em>${nx.status === 'live' ? 'On court now' : 'Next ' + esc(fmtTime(nx.start))} · Court ${nx.court} v ${esc(nx.a === t.code ? sideName(nx, 1) : sideName(nx, 0))}</em>` : ''}</a>`; }).join('') : '<p>No team or player matches that search.</p>';
  });
  clearInterval(liveTimer); clearInterval(clockTimer); liveTimer = clockTimer = null;
  if (tab === 'live' && FIT.matches) {
    fitLive();
    clockTimer = setInterval(() => { const el = $('#lvclock'); if (el) el.textContent = fmtTime(new Date()); }, 15000);
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) liveTimer = setInterval(nextLiveCat, ROTATE_MS);
  }
  if (!keepScroll) window.scrollTo(0, 0);
}

$('#evSub').textContent = `Player portal · ${TOURNAMENT.venue}`;
$('.top-c b').textContent = TOURNAMENT.name;
$('#evCtr').textContent = `${TOURNAMENT.dateLabel.replace(/^\w+, /, '')} · ${TOURNAMENT.venue}, ${TOURNAMENT.address.split(',')[0]}`;
$('#reload').addEventListener('click', () => location.reload());
$('#app').addEventListener('click', e => { const b = e.target.closest('.mybtn'); if (b) setMy(MY === b.dataset.club ? null : b.dataset.club); });
document.title = (demo ? '[DEMO] ' : '') + TOURNAMENT.name + ' · Player Portal';
$('#foot').innerHTML = `<div class="foot-in"><span><b>${esc(TOURNAMENT.name)}</b> · ${esc(TOURNAMENT.venue)}, ${esc(TOURNAMENT.address)}</span><span>This page does not update by itself. Reload for the latest published results.</span></div>`;
addEventListener('hashchange', () => render(false));
render(false);
</script>
</body>
